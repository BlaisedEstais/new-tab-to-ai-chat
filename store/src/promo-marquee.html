<!doctype html>
<!-- Chrome Web Store marquee promo tile, 1400x560. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  body {
    width: 1400px; height: 560px; color: #fff;
    background:
      radial-gradient(620px 460px at 22% 50%, rgb(120 114 255 / 0.42), transparent 72%),
      linear-gradient(160deg, #1e1b52 0%, #0d0c22 100%);
  }
  .copy { position: absolute; left: 110px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .copy iframe { width: 104px; height: 104px; border: 0; margin-bottom: 30px; filter: drop-shadow(0 14px 26px rgb(0 0 0 / 0.4)); }
  .copy h1 { margin: 0; font-size: 52px; line-height: 1.05; font-weight: 700; letter-spacing: -0.03em; }
  .copy p { margin: 16px 0 0; font-size: 24px; line-height: 1.35; color: #c9c6ff; }
  .shot {
    position: absolute; left: 740px; top: 70px; width: 720px; height: 450px;
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 40px 90px rgb(0 0 0 / 0.55), 0 0 0 1px rgb(255 255 255 / 0.12);
  }
  .shot img { display: block; width: 720px; }
</style>
</head>
<body>
  <div class="copy">
    <iframe src="icon.html?size=104&inset=0" scrolling="no"></iframe>
    <h1>New Tab to AI Chat</h1>
    <p>Your AI chat in every new tab.<br>Your cursor stays in the address bar.</p>
  </div>
  <div class="shot"><img src="../screenshot-1.png" alt=""></div>
</body>
</html>
