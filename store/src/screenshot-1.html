<!doctype html>
<!-- Store screenshot 1 (1280x800): the core promise. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  body {
    width: 1280px; height: 800px;
    background:
      radial-gradient(900px 420px at 50% -8%, #e4e1ff 0%, transparent 70%),
      linear-gradient(180deg, #f7f7fc 0%, #ebeaf6 100%);
    color: #16151f;
  }
  .headline { top: 50px; }
  .headline p { color: #585670; }
  .headline em { font-style: normal; color: #4f48e0; }
  .window { left: 80px; top: 184px; }
  .content { background-image: url(captures/chatgpt-light.png); }
  /* The tab's icon is the site's own, cropped from the capture (its sidebar logo, scaled to 16px). */
  .favicon { background: url(captures/chatgpt-light.png) no-repeat; background-size: 1024px 483px; background-position: -12.8px -12.8px; }

  /* The callout under the focused address bar */
  .omnibox.focused { box-shadow: 0 0 0 2px var(--focus), 0 0 0 7px rgb(11 87 208 / 0.14); }
  .callout {
    position: absolute; left: 92px; top: 50px; z-index: 2;
    padding: 9px 14px; border-radius: 10px;
    background: #16151f; color: #fff; font-size: 14px; font-weight: 500; white-space: nowrap;
    box-shadow: 0 10px 24px rgb(0 0 0 / 0.22);
  }
  .callout::before {
    content: ''; position: absolute; left: 18px; top: -6px;
    border: 6px solid transparent; border-top: 0; border-bottom-color: #16151f;
  }
  .callout b { color: #a9a5ff; font-weight: 600; }
</style>
</head>
<body>
  <div class="headline">
    <h1>Your AI chat in every new tab</h1>
    <p>…and <em>your cursor stays in the address bar.</em></p>
  </div>

  <div class="window light-browser">
    <div class="tabstrip">
      <div class="lights"><i></i><i></i><i></i></div>
      <div class="tab">
        <div class="favicon"></div>ChatGPT
        <svg class="close" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </div>
      <svg class="plus" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </div>
    <div class="toolbar">
      <svg class="nav" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7M19 12H5"/></svg>
      <svg class="nav dim" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      <svg class="nav" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
      <div class="omnibox focused">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4-4"/></svg>
        <span class="caret"></span>
        <span>Search Google or type a URL</span>
        <div class="callout"><b>Cursor stays here</b> · type a search or a URL, as always</div>
      </div>
      <span class="ext"><img src="../../extension/icons/icon32.png" alt=""></span>
      <svg class="menu" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
    </div>
    <div class="content"></div>
  </div>
</body>
</html>
