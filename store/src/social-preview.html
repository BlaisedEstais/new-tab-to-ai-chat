<!doctype html>
<!-- GitHub social preview, 1280x640 (Settings → General → Social preview). -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  body {
    width: 1280px; height: 640px; color: #fff;
    background:
      radial-gradient(600px 480px at 22% 50%, rgb(120 114 255 / 0.42), transparent 72%),
      linear-gradient(160deg, #1e1b52 0%, #0d0c22 100%);
  }
  .copy { position: absolute; left: 90px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
  .copy iframe { width: 100px; height: 100px; border: 0; margin-bottom: 30px; filter: drop-shadow(0 14px 26px rgb(0 0 0 / 0.4)); }
  .copy h1 { margin: 0; font-size: 56px; line-height: 1.05; font-weight: 700; letter-spacing: -0.03em; }
  .copy p { margin: 16px 0 0; font-size: 24px; line-height: 1.35; color: #c9c6ff; }
  .copy small { margin-top: 26px; font-size: 17px; color: #8f8cc0; }
  .shot {
    position: absolute; left: 660px; top: 110px; width: 700px; height: 437px;
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 40px 90px rgb(0 0 0 / 0.55), 0 0 0 1px rgb(255 255 255 / 0.12);
  }
  .shot img { display: block; width: 700px; }
</style>
</head>
<body>
  <div class="copy">
    <iframe src="icon.html?size=100&inset=0" scrolling="no"></iframe>
    <h1>Straight to Chat</h1>
    <p>Your AI chat in every new tab.<br>Your cursor stays in the address bar.</p>
    <small>Open-source Chrome extension · No tracking</small>
  </div>
  <div class="shot"><img src="../screenshot-1.png" alt=""></div>
</body>
</html>
